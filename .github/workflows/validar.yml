name: Validar projeto

on:
  pull_request:
  push:
    branches:
      - main
      - v2-montagens-auto-update

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar arquivos Python
        run: python -m compileall -q .
